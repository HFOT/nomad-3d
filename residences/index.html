</style><header><small>CARAKURI / HABITAT · CORN</small><h1>灯りが集まる、石の住まい。</h1><p>4つの住宅と、炎の大金庫へつながる空中配管</p></header><details><summary>住宅を配置する</summary><p>住宅を選択して移設・回転できます。変更に合わせて空中幹線を再接続します。</p><button id="move">選択住宅を移設</button><button id="rotate">90°回転</button><p><label>X <input id="posx" type="number" min="-100" max="100" value="36" style="width:70px"></label> <label>Z <input id="posz" type="number" min="-100" max="100" value="14" style="width:70px"></label></p><button id="place">指定位置へ移設</button><p><select id="tier" aria-label="追加する住宅"><option value="0">小住宅</option><option value="1">標準住宅</option><option value="2">回廊住宅</option><option value="3">クジラ邸</option></select> <button id="add">新しい住宅を追加</button></p><p>住宅の規模は保有規模の表現案です。金額の閾値は未設定です。</p><a href="../town/">からくりの町</a></details><aside><select id="view" aria-label="住宅を選択"><option value="all">街路全体</option><option value="0">01 小住宅</option><option value="1">02 標準住宅</option><option value="2">03 回廊住宅</option><option value="3">04 クジラ邸</option></select><button id="solo">単体表示</button><button id="export">選択住宅のGLB</button><button id="reset">全景に戻る</button><label><input type="checkbox" id="pipes" checked>配管</label><label><input type="checkbox" id="pause">停止</label><output id="status">建築中…</output><output id="error"></output></aside><script type="module" src="viewer.js"></script></html>
