<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><meta name="theme-color" content="#1c211e"><title>NOMAD — 灯りを運ぶ旅人</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../shared/switcher.css"><script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script></head>
<body><main id="stage" aria-label="冒険家ロボットの3Dビューア"></main>
<header><div class="wordmark">NOMAD<span>FIELD COMPANION / 01 · BY CORN</span></div><div class="top-actions"><button id="reference">原画を見る ↗</button><button id="capture" title="現在の画角をPNGで保存">写真を撮る</button></div></header>
<section class="caption"><div class="eyebrow"><i></i> LITTLE WANDERER</div><h1>灯りを運ぶ旅人。</h1><p>遠回りも、悪くない。</p></section>
<aside class="panel"><div class="panel-heading"><span>CHARACTER STUDIO</span><button id="collapse" aria-expanded="true" aria-label="設定を開閉">−</button></div><div id="settings">
<fieldset><legend>しぐさ</legend><div class="buttons motion"><button data-motion="Idle" class="active" aria-pressed="true">待機</button><button data-motion="Walk" aria-pressed="false">歩く</button><button data-motion="Wave" aria-pressed="false">手を振る</button><button data-motion="Look" aria-pressed="false">見回す</button></div></fieldset>
<div class="slider-row"><label for="speed">動きの速さ</label><input id="speed" type="range" min="0.25" max="1.75" step="0.05" value="1"><output id="speed-value">1.0×</output></div>
<fieldset><legend>光</legend><div class="buttons"><button data-light="dusk" class="active" aria-pressed="true">黄昏</button><button data-light="studio" aria-pressed="false">スタジオ</button><button data-light="night" aria-pressed="false">夜</button></div></fieldset>
<fieldset><legend>表面</legend><div class="buttons"><button data-material="original" class="active" aria-pressed="true">仕上げ</button><button data-material="clay" aria-pressed="false">クレイ</button><button data-material="wire" aria-pressed="false">ワイヤー</button></div></fieldset>
<div class="toggles"><label><input id="rotate" type="checkbox">自動回転</label><label><input id="lantern" type="checkbox" checked>ランタン</label><label><input id="pause" type="checkbox">一時停止</label></div>
<div class="bottom-actions"><button id="reset">視点を戻す</button><button id="export" class="export">モデルを保存 ↓<small>GLB・4つのアニメーション</small></button></div></div></aside>
<footer><span>ドラッグで回転 <b>·</b> ホイールで拡大 <b>·</b> 右ドラッグで移動</span><span id="status" role="status">立体を組み立てています…</span></footer>
<div id="loading"><span class="loader"></span><p>旅の支度をしています</p></div>
<dialog id="concept-dialog"><button id="close-reference" aria-label="原画を閉じる">×</button><img src="concept.png" alt="制作元の冒険家ロボットのコンセプト画像"><p>ORIGINAL CONCEPT</p></dialog>
<script type="module" src="../shared/switcher.js" data-character="nomad"></script>
<script type="module" src="viewer.js"></script></body></html>
