<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOX — Proof Bearer</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../shared/switcher.css"><script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script></head><body><main id="stage"></main><header><div class="wordmark">NOX<span>PROOF BEARER / 09 · BY CORN</span></div><div class="top-actions"><button id="capture">写真を撮る</button></div></header><section class="caption"><div class="eyebrow"><i></i>PROVE IT. DON'T SHOW IT.</div><h1>夜をまとう、証し人。</h1><p>見せない。それでも、証せる。</p></section><aside class="panel"><div class="panel-heading">PROOF BEARER <button id="collapse">−</button></div><div id="settings"><p class="demo-label">SIMULATION · 実際のproofとは未接続</p><fieldset><legend>しぐさ</legend><div class="buttons"><button data-motion="Idle" class="active">待機</button><button data-motion="Drift">漂う</button></div></fieldset><label class="shared-toggle"><input id="travel" type="checkbox" checked>フィールドを漂う</label><div class="slider-row"><label for="speed">速さ</label><input id="speed" type="range" min="0.5" max="2" step=".1" value="1"><output id="speed-value">1×</output></div><p class="explanation">白磁の仮面と宵闇のマントをまとう、浮遊するからくり。手にした提灯の覆いは、時おり開いては閉じ、灯りが見え隠れします。消さない。ただ、見せ方を選ぶだけ。仮面の下に何がいるのかは、誰も知りません。</p><div class="buttons"><button id="prove">見せずに、証す ✶</button></div><p id="status" role="status">静かに漂っています</p><div class="toggles"><label><input id="pause" type="checkbox">一時停止</label><label><input id="rotate" type="checkbox">自動回転</label></div><div class="bottom-actions"><button id="reset">視点を戻す</button><button id="export">モデルを保存 ↓</button></div></div></aside><footer><span>ドラッグで回転 · ホイールで拡大</span><span>BY CORN · NOX</span></footer><script type="module" src="../shared/switcher.js" data-character="nox"></script>
